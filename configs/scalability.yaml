# Giai đoạn 8 — Scalability study (profiling pandas vs PySpark trên HIGGS full)
# Lý do từng giá trị: docs/khac-biet-so-voi-bai-goc.md mục 4.7

source_url: https://archive.ics.uci.edu/ml/machine-learning-databases/00280/HIGGS.csv.gz
raw_file: data/raw/higgs_full/higgs_full_raw.parquet   # trên Drive, tương đối với --project-dir

sizes: [100000, 1000000, 3000000, 6000000, 11000000]   # mốc nhỏ là phần đầu của mốc lớn
repeats: 3                  # mỗi mốc × engine; báo trung vị
timeout_seconds: 1200       # quá giờ -> 'timeout'; engine đã thất bại thì bỏ qua các mốc lớn hơn

spark_master: local[*]
spark_driver_memory: 4g     # giới hạn bộ nhớ cố định của Spark (không đo bộ nhớ JVM)

parity_rtol: 1.0e-9         # pandas và PySpark phải cho cùng điểm profile ở mọi mốc cả hai cùng chạy được
