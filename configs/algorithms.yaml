# Siêu tham số của 6 thuật toán downstream — theo docs/kien-truc-mo-hinh-va-ky-thuat.md mục 3
# Tên thuật toán trùng với configs/experiment_matrix.yaml.
# Không ghi ở đây: random_state (lấy từ seed của lượt chạy, configs/seeds.yaml)
# và số cụm của clustering (= số lớp thật của target).
algorithms:
  logistic_regression: {max_iter: 1000}
  # max_samples: mỗi cây học trên 10% số dòng — không có thì 1 lượt trên 800.000 dòng HIGGS mất ~13 phút (đo ở cell 11.2)
  random_forest: {n_estimators: 100, n_jobs: -1, max_samples: 0.1}
  ridge: {alpha: 1.0}
  gradient_boosting: {n_estimators: 100}
  kmeans: {n_init: 10}
  # n_init: 10: khởi tạo 1 lần thì AMI dao động mạnh theo seed (0,10–0,21, đo ở cell 11.5); diag để bù thời gian
  gmm: {covariance_type: diag, n_init: 10}
